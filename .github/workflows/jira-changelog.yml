name: 🚀 Betmaker Changelog → Confluence Sync

on:
  # Trigger manually from GitHub Actions tab with optional inputs
  workflow_dispatch:
    inputs:
      version_prefix:
        description: 'Version prefix (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
  # Automatically run every hour to check for new merges to main
  schedule:
    - cron: '0 * * * *'

jobs:
  sync-changelog:
    name: Sync Betmaker PR Merges → Confluence
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout mcp-jira-updates
        uses: actions/checkout@v4

      - name: ⬇️ Checkout betmaker repo
        uses: actions/checkout@v4
        with:
          repository: playlogiq/pq-docker
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: betmaker-repo
          fetch-depth: 50

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔄 Run Changelog Sync (PR Merges Only)
        env:
          JIRA_HOST: ${{ secrets.JIRA_HOST }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          CONFLUENCE_PAGE_URL: https://playlogiq.atlassian.net/wiki/spaces/SD/pages/888995841/Changelog+Betmaker
          VERSION_PREFIX: ${{ inputs.version_prefix || 'v1.0.0' }}
          MERGES_ONLY: 'true'
          ONLY_NEW_COMMITS: 'true'
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          npx tsx src/cli.ts sync \
            --path ${{ github.workspace }}/betmaker-repo/src/betmaker \
            --branch main \
            --confluence https://playlogiq.atlassian.net/wiki/spaces/SD/pages/888995841/Changelog+Betmaker \
            --only-new

      - name: 📋 Show Recent Sync Logs
        if: always()
        run: npx tsx src/cli.ts logs --lines 10
